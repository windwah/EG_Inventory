# =============================================================================
# Windwah Inventory System - Runtime Configuration
# =============================================================================

server.port=8080
server.servlet.context-path=/

# -----------------------------------------------------------------------------
# HTTP / Servlet / Form UTF-8 (中文/繁體中文正常儲存，避免 form POST 亂碼)
# -----------------------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# -----------------------------------------------------------------------------
# Spring MVC / Thymeleaf UTF-8 輸出 (避免頁面中文亂碼)
# -----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.messages.encoding=UTF-8
# React SPA production bundle served from classpath:/static/ (Vite dist copied by Maven)
spring.web.resources.static-locations=classpath:/static/

# -----------------------------------------------------------------------------
# Datasource (PostgreSQL by default). Override via env vars if needed.
#  - stringtype=unspecified : 讓 String/JSON 參數使用 PostgreSQL 原生型別判斷
#  - charSet=UTF8           : 強制 JDBC driver 連線為 UTF-8 (PG JDBC 42+ 預設 UTF-8，寫死避免 Windows 地區語系繼承)
#  - Application 端: connectionSetNames=SET NAMES 'UTF8'
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory?charSet=UTF8&stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=987123
spring.datasource.driver-class-name=org.postgresql.Driver
# 每個新建連線先執行 SET NAMES (備援機制，確保用戶端/伺服端 encoding 一致)
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

# -----------------------------------------------------------------------------
# JPA / Hibernate - 中文欄位使用 VARCHAR，JDBC batch 用 UTF-8
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Amazon SP-API integration
# Set amazon.sp-api.enabled=true and populate credentials when ready; otherwise
# the client will run in STUB (dry-run) mode.
# -----------------------------------------------------------------------------
amazon.sp-api.enabled=false
amazon.sp-api.endpoint=https://sellingpartnerapi-na.amazon.com
amazon.sp-api.client-id=
amazon.sp-api.client-secret=
amazon.sp-api.refresh-token=
amazon.sp-api.feed-type=POST_INVENTORY_AVAILABILITY_DATA

# -----------------------------------------------------------------------------
# eBay REST integration
# Set ebay.api.enabled=true and populate credentials when ready; otherwise
# the client will run in STUB (dry-run) mode.
# -----------------------------------------------------------------------------
ebay.api.enabled=false
ebay.api.endpoint=https://api.ebay.com
ebay.api.client-id=
ebay.api.client-secret=
ebay.api.access-token=
ebay.api.environment=PRODUCTION

# -----------------------------------------------------------------------------
# eBay File Exchange defaults (used by eBay Excel exporter)
# -----------------------------------------------------------------------------
ebay.export.default-action=Add
ebay.export.item-location=Hong Kong
ebay.export.postal-code=
ebay.export.country=HK
ebay.export.shipping-profile=Standard Shipping
ebay.export.default-category-id=

# -----------------------------------------------------------------------------
# Amazon export defaults
# -----------------------------------------------------------------------------
amazon.export.default-currency=HKD

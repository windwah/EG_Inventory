# Test profile - uses in-memory H2 instead of Postgres
spring.datasource.url=jdbc:h2:mem:inventory_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Do not check for Thymeleaf template locations in tests without web context
spring.thymeleaf.check-template-location=false

# Force stub mode (safe default)
amazon.sp-api.enabled=false
ebay.api.enabled=false

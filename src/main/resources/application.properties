# =============================================================================
# Windwah Inventory System - Runtime Configuration
# =============================================================================

server.port=8080
server.servlet.context-path=/

# -----------------------------------------------------------------------------
# Spring MVC / Thymeleaf
# -----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

# -----------------------------------------------------------------------------
# Datasource (PostgreSQL by default). Override via env vars if needed.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Amazon SP-API integration
# Set amazon.sp-api.enabled=true and populate credentials when ready; otherwise
# the client will run in STUB (dry-run) mode.
# -----------------------------------------------------------------------------
amazon.sp-api.enabled=false
amazon.sp-api.endpoint=https://sellingpartnerapi-na.amazon.com
amazon.sp-api.client-id=
amazon.sp-api.client-secret=
amazon.sp-api.refresh-token=
amazon.sp-api.feed-type=POST_INVENTORY_AVAILABILITY_DATA

# -----------------------------------------------------------------------------
# eBay REST integration
# Set ebay.api.enabled=true and populate credentials when ready; otherwise
# the client will run in STUB (dry-run) mode.
# -----------------------------------------------------------------------------
ebay.api.enabled=false
ebay.api.endpoint=https://api.ebay.com
ebay.api.client-id=
ebay.api.client-secret=
ebay.api.access-token=
ebay.api.environment=PRODUCTION

# -----------------------------------------------------------------------------
# eBay File Exchange defaults (used by eBay Excel exporter)
# -----------------------------------------------------------------------------
ebay.export.default-action=Add
ebay.export.item-location=Hong Kong
ebay.export.postal-code=
ebay.export.country=HK
ebay.export.shipping-profile=Standard Shipping
ebay.export.default-category-id=

# -----------------------------------------------------------------------------
# Amazon export defaults
# -----------------------------------------------------------------------------
amazon.export.default-currency=HKD

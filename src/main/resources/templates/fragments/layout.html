<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} ?: 'Inventory System'">Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-primary navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/products">Inventory System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Products</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/brands}">Brands</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/manufacturers}">Manufacturers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products/new}">Add Product</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/export}">Export / Submit</a></li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="container mt-5 mb-3 text-muted small">
    &copy; Windwah EGate &mdash; Inventory System
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</div>

</body>
</html>

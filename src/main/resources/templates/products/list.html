<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<!-- DataTables Bootstrap 5 CSS -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.8/css/dataTables.bootstrap5.min.css"
      crossorigin="anonymous" />
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:if="${info}" class="alert alert-info mb-3" th:text="${info}"></div>
    <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <h1>Products</h1>
            <p class="text-muted" th:text="${#lists.size(products)} + ' item(s)'"></p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/brands}">Brands</a>
            <a class="btn btn-outline-secondary" th:href="@{/manufacturers}">Manufacturers</a>
            <a class="btn btn-primary" th:href="@{/products/new}">+ Add Product</a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table id="productsTable" class="table table-striped table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th data-priority="6" style="width: 96px;">Image</th>
                    <th data-priority="3">Index</th>
                    <th data-priority="2">SKU</th>
                    <th data-priority="1">Title</th>
                    <th data-priority="4">Brand</th>
                    <th data-priority="5">Manufacturer</th>
                    <th>Collection</th>
                    <th>Qty</th>
                    <th data-orderable="false">Purchase</th>
                    <th data-orderable="false">RRP EUR</th>
                    <th data-orderable="false">Availability</th>
                    <th>Status</th>
                    <th data-priority="1" data-orderable="false" style="width: 200px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td>
                        <a th:if="${p.imageUrls != null and #strings.length(p.imageUrls) > 0}"
                           th:href="${p.imageUrls}" target="_blank" rel="noopener">
                            <img style="max-width: 80px; max-height: 60px; object-fit: contain;"
                                 th:src="${p.imageUrls}"
                                 th:alt="${p.sku}">
                        </a>
                        <span th:unless="${p.imageUrls != null and #strings.length(p.imageUrls) > 0}" class="text-muted small">n/a</span>
                    </td>
                    <td th:text="${p.indexCode}"></td>
                    <td><code th:text="${p.sku}"></code></td>
                    <td th:text="${p.title}"></td>
                    <td th:text="${p.brand != null ? p.brand.name : ''}"></td>
                    <td th:text="${p.manufacturer != null ? p.manufacturer.name : ''}"></td>
                    <td th:text="${p.collection}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td th:if="${p.purchasePrice != null}" th:text="${p.currency} + ' ' + ${#numbers.formatDecimal(p.purchasePrice, 0, 2)}"></td>
                    <td th:unless="${p.purchasePrice != null}" class="text-muted small">—</td>
                    <td th:if="${p.rrpEur != null}" th:text="${'EUR ' + #numbers.formatDecimal(p.rrpEur, 0, 2)}"></td>
                    <td th:unless="${p.rrpEur != null}" class="text-muted small">—</td>
                    <td>
                        <span th:if="${p.availability != null}"
                              class="badge"
                              th:classappend="${#strings.startsWith(p.availability, 'AVAILABLE')}
                                      ? 'bg-success'
                                      : (${#strings.startsWith(p.availability, 'VERY LIMITED')}
                                          ? 'bg-danger'
                                          : (${#strings.startsWith(p.availability, 'LIMITED')} ? 'bg-warning text-dark' : 'bg-info text-dark'))"
                              th:text="${p.availability}"></span>
                    </td>
                    <td><span th:text="${p.listingStatus}"
                              class="badge"
                              th:classappend="${p.listingStatus.name() == 'ACTIVE'}
                                      ? 'bg-success'
                                      : (${p.listingStatus.name() == 'DRAFT'} ? 'bg-secondary' : 'bg-warning')"></span>
                    </td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/products/{id}/edit(id=${p.id})}"
                               title="Edit product">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-pencil me-1" viewBox="0 0 16 16">
                                    <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                                </svg>
                                Edit
                            </a>
                            <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this product?\nSKU: ' + this.dataset.sku + '\n\nThis cannot be undone.');"
                                  th:attr="data-sku=${p.sku}">
                                <button class="btn btn-sm btn-outline-danger" type="submit" title="Delete product">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-trash3 me-1" viewBox="0 0 16 16">
                                        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47ZM8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5Z"/>
                                    </svg>
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- DataTables + jQuery + Bootstrap5 integration JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.8/js/dataTables.min.js"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.8/js/dataTables.bootstrap5.min.js"
        crossorigin="anonymous"></script>
<script th:inline="none">
    $(document).ready(function () {
        $('#productsTable').DataTable({
            pageLength: 25,
            lengthMenu: [10, 25, 50, 100, 250],
            order: [[2, 'asc']],
            responsive: true,
            autoWidth: false,
            language: {
                search: 'Search all columns:',
                lengthMenu: 'Show _MENU_ products per page',
                info: 'Showing _START_ to _END_ of _TOTAL_ products',
                infoEmpty: 'No products found',
                emptyTable: 'No products yet — click "Add Product" to begin.',
                zeroRecords: 'No matching products found',
                paginate: {
                    first: '«',
                    previous: '‹ Prev',
                    next: 'Next ›',
                    last: '»'
                }
            },
            columnDefs: [
                { orderable: false, targets: [0, 8, 9, 10, 12] },
                { searchable: false, targets: [0, 7, 8, 9, 10, 11, 12] },
                { className: 'text-end', targets: [7, 8, 9] },
                { className: 'text-nowrap', targets: [1, 2, 11, 12] }
            ]
        });
    });
</script>
</body>
</html>

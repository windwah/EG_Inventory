<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:if="${info}" class="alert alert-info mb-3" th:text="${info}"></div>

    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <h1>Products</h1>
            <p class="text-muted" th:text="${#lists.size(products)} + ' item(s)'"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/products/new}">+ Add Product</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead>
                <tr>
                    <th>SKU</th>
                    <th>Title</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th style="width: 260px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center text-muted py-4">No products yet. Click <b>Add Product</b> to begin.</td>
                </tr>
                <tr th:each="p : ${products}">
                    <td th:text="${p.sku}"></td>
                    <td th:text="${p.title}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td th:text="${p.currency} + ' ' + ${#numbers.formatDecimal(p.price, 0, 2)}"></td>
                    <td><span th:text="${p.listingStatus}"
                              class="badge"
                              th:classappend="${p.listingStatus.name() == 'ACTIVE'}
                                      ? 'bg-success'
                                      : (${p.listingStatus.name() == 'DRAFT'} ? 'bg-secondary' : 'bg-warning')"></span>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a>
                        <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this product?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

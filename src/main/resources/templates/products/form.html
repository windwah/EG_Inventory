<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${id == null} ? 'Add Product' : 'Edit Product')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:if="${info}" class="alert alert-info mb-3" th:text="${info}"></div>

    <h1 th:if="${id == null}">Add Product</h1>
    <h1 th:if="${id != null}">
        Edit Product
        <small class="text-muted fs-5" th:text="'(' + ${sku} + ')'"></small>
    </h1>

    <form th:action="${id == null} ? @{/products} : @{/products/{id}/edit(id=${id})}"
          method="post" class="mt-4 card p-4 col-lg-8"
          th:object="${product}">

        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
            Please correct the error(s) below.
            <ul class="mb-0 mt-2">
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">SKU *</label>
                <input th:if="${id == null}" type="text" class="form-control" th:field="*{sku}" maxlength="64" />
                <input th:if="${id != null}" type="text" class="form-control-plaintext"
                       th:value="${sku}" readonly disabled />
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Title *</label>
                <input type="text" class="form-control" th:field="*{title}" maxlength="512" />
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="col-md-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            </div>
            <div class="col-md-3">
                <label class="form-label">Quantity *</label>
                <input type="number" min="0" class="form-control" th:field="*{quantity}" />
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Price *</label>
                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{price}" />
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Currency</label>
                <input type="text" class="form-control" th:field="*{currency}" placeholder="HKD / USD / ..." />
            </div>
            <div class="col-md-3">
                <label class="form-label">Condition</label>
                <select class="form-select" th:field="*{condition}">
                    <option value="NEW">NEW</option>
                    <option value="USED_LIKE_NEW">USED_LIKE_NEW</option>
                    <option value="USED_VERY_GOOD">USED_VERY_GOOD</option>
                    <option value="USED_GOOD">USED_GOOD</option>
                    <option value="ACCEPTABLE">ACCEPTABLE</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">UPC</label>
                <input type="text" class="form-control" th:field="*{upc}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">EAN</label>
                <input type="text" class="form-control" th:field="*{ean}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">MPN</label>
                <input type="text" class="form-control" th:field="*{mpn}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Brand</label>
                <input type="text" class="form-control" th:field="*{brand}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Manufacturer</label>
                <input type="text" class="form-control" th:field="*{manufacturer}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" th:field="*{category}" />
            </div>
            <div class="col-md-12">
                <label class="form-label">Image URLs (comma-separated)</label>
                <input type="text" class="form-control" th:field="*{imageUrls}" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Weight (kg)</label>
                <input type="number" step="0.001" min="0" class="form-control" th:field="*{weightKg}" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Dimensions</label>
                <input type="text" class="form-control" th:field="*{dimensions}" placeholder="e.g. 10x5x3 cm" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Listing Status</label>
                <select class="form-select" th:field="*{listingStatus}">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="INACTIVE">INACTIVE</option>
                    <option value="DRAFT">DRAFT</option>
                </select>
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4"
                    th:text="${id == null} ? 'Create Product' : 'Save Changes'"></button>
            <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

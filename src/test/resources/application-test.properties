# Test profile - uses dedicated PostgreSQL test DB inventory_test (local PG 18 instance)
#  - Create DB once: psql -U postgres -d postgres -c "CREATE DATABASE inventory_test OWNER postgres ENCODING 'UTF8' LC_COLLATE='zh_HK.UTF8' LC_CTYPE='zh_HK.UTF8' TEMPLATE=template0"
#  - Re-create fresh schema every test run via ddl-auto=create-drop
#  - connection-init-sql required for Chinese charsets on PG JDBC
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_test?charSet=UTF8&stringtype=unspecified
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=987123
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8

# Do not check for Thymeleaf template locations in tests without web context
spring.thymeleaf.check-template-location=false

# Force stub mode (safe default)
amazon.sp-api.enabled=false
ebay.api.enabled=false
